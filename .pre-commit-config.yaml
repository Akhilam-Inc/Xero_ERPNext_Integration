# .pre-commit-config.yaml — Akhilam Inc.
#
# SETUP (one-time per developer machine):
#   chmod +x install-hooks.sh && ./install-hooks.sh
#
# MANUAL RUN:
#   pre-commit run --all-files
#
# UPDATE HOOK VERSIONS:
#   pre-commit autoupdate

default_stages: [pre-commit]

repos:

  # ─── 1. RUFF — linter + formatter ────────────────────────────────────────
  # Config lives in pyproject.toml under [tool.ruff] — auto-detected.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: "Ruff lint"
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python]
      - id: ruff-format
        name: "Ruff format"
        types_or: [python]

  # ─── 2. SEMGREP — Frappe official 46 rules ────────────────────────────────
  # Requires: frappe-semgrep-rules cloned at ~/frappe-semgrep-rules
  # install-hooks.sh handles this automatically.
  - repo: local
    hooks:
      - id: semgrep-frappe
        name: "Semgrep — Frappe official rules (ERROR only)"
        language: system
        entry: semgrep
        args:
          - --config
          - ~/frappe-semgrep-rules/rules
          - --severity=ERROR
          - --error
          - --quiet
        types_or: [python]
        pass_filenames: true
        stages: [pre-commit]

  # ─── 3. SEMGREP — Akhilam custom rules (AKH-01 to AKH-08) ───────────────
      - id: semgrep-akhilam
        name: "Semgrep — Akhilam custom rules"
        language: system
        entry: semgrep
        args:
          - --config
          - semgrep/akhilam-custom-rules.yaml
          - --error
          - --quiet
        types_or: [python]
        pass_filenames: true
        stages: [pre-commit]

  # ─── 4. PYTEST — runs on pre-push, not pre-commit (too slow) ─────────────
      - id: pytest
        name: "Pytest — unit tests"
        language: system
        entry: bash -c 'cd /home/frappe/frappe-bench && bench run-tests --app xero_erpnext_integration 2>&1'
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ─── 5. PRETTIER — JS / Vue / SCSS ───────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        exclude: |
          (?x)^(
            xero_erpnext_integration/public/dist/.*|
            .*node_modules.*|
            .*boilerplate.*|
            xero_erpnext_integration/templates/includes/.*|
            xero_erpnext_integration/public/js/lib/.*
          )$

  # ─── 6. ESLINT ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: [--quiet]
        exclude: |
          (?x)^(
            xero_erpnext_integration/public/dist/.*|
            cypress/.*|
            .*node_modules.*|
            .*boilerplate.*|
            xero_erpnext_integration/templates/includes/.*|
            xero_erpnext_integration/public/js/lib/.*
          )$

  # ─── 7. GENERAL HYGIENE ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "Trim trailing whitespace"
        files: "xero_erpnext_integration.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: end-of-file-fixer
        name: "Ensure files end with newline"
      - id: check-yaml
        name: "Validate YAML files"
      - id: check-json
        name: "Validate JSON files"
      - id: check-toml
        name: "Validate TOML files"
      - id: check-merge-conflict
        name: "Check for merge conflict markers"
      - id: check-added-large-files
        name: "Block large file commits"
        args: [--maxkb=500]
      - id: debug-statements
        name: "Block debug statements (pdb, breakpoint)"
        types: [python]
      - id: mixed-line-ending
        args: [--fix=lf]

ci:
  autoupdate_schedule: weekly
  skip: [semgrep-frappe, semgrep-akhilam, pytest]
  submodules: false
