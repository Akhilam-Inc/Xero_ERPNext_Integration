name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Auto-fix formatting
        # Run all hooks and let them reformat files in place; || true means we
        # don't fail the job here — the gating check below handles real errors.
        run: pre-commit run --all-files || true

      - name: Commit auto-fixes if any
        run: |
          if ! git diff --quiet; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add -A
            git commit -m "style: auto-format code with pre-commit"
            git push
          fi

      - name: Verify pre-commit clean
        # This is the gating check. After the auto-fix pass above, this must pass.
        # If it still fails, there is a genuine lint violation (not just formatting).
        run: pre-commit run --all-files

      - name: Download Semgrep rules
        run: |
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
          # Add Akhilam custom performance rules (N+1, unbounded fetches, bulk ops)
          cp .github/semgrep/performance.yml frappe-semgrep-rules/rules/performance.yml

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .