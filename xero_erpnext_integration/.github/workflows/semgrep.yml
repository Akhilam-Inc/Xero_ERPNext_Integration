name: Semgrep — Frappe Code Quality

on:
  pull_request:
    branches: [version-16, main]
  push:
    branches: [version-16]

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # needed to post PR annotations via SARIF upload

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Frappe v16 minimum Python version — matches app runtime so semgrep
          # correctly parses Python 3.11 syntax (e.g. str | None union types)
          python-version: "3.11"

      - name: Install semgrep
        run: pip install semgrep

      - name: Clone Frappe official semgrep rules
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Add Akhilam custom performance rules
        # Copies the 13 custom N+1 / unbounded-fetch / bulk-op rules into the
        # rules directory so they are picked up by the single --config path below
        run: cp .github/semgrep/performance.yml frappe-semgrep-rules/rules/performance.yml

      - name: Run semgrep
        # --error  → exit code 1 on ANY finding (ERROR or WARNING) — blocks PR merge
        # --sarif  → GitHub-native output format for inline PR diff annotations
        run: |
          semgrep \
            --config=frappe-semgrep-rules/rules \
            --error \
            --sarif \
            --output=semgrep-results.sarif \
            .

      - name: Upload SARIF to GitHub Code Scanning
        # Runs even when semgrep fails so annotations appear on the failing PR
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
